<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cámaras de seguridad</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            background: #050505;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* ESCENA: tamaño real de mapa.jpg (1422 x 736), escalada con JS para caber en cualquier pantalla */
        .escena {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 1422px;
            height: 736px;
            transform: translate(-50%, -50%) scale(var(--escala, 1));
            transform-origin: center center;
            overflow: hidden;
        }

        .escena > img.fondo {
            width: 100%;
            height: 100%;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* ===== CONO DE LUZ: la lámpara queda fuera de la imagen, por encima del borde superior ===== */
        /* Haz de luz en trapecio: ancho de sobra para que el monitor entero quede iluminado */
        /* Oscuridad de la habitación, con un hueco en forma de cono donde llega la luz */
        .oscuridad {
            position: absolute;
            left: -40px;
            top: -40px;
            width: 1502px;
            height: 816px;
            background: rgba(0, 0, 0, .5);
            pointer-events: none;
            z-index: 6;
            filter: blur(14px);
            /* coordenadas desplazadas +40 por el margen: haz ancho que entra por arriba */
            clip-path: path(evenodd,
                "M0 0 H1502 V816 H0 Z M488 -40 L1014 -40 L1390 776 L112 776 Z");
        }

        /* Brillo cálido dentro del cono (se suma a la imagen) */
        .brillo {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 8;
            mix-blend-mode: screen;
            filter: blur(14px);
            clip-path: polygon(448px -80px, 974px -80px, 1350px 736px, 72px 736px);
            background: radial-gradient(ellipse 900px 1000px at 711px -80px,
                        rgba(255, 244, 214, .20) 0%,
                        rgba(255, 232, 180, .12) 45%,
                        rgba(255, 220, 160, .05) 90%);
            animation: parpadeo-luz 5.3s infinite;
        }

        /* Cuando la luz falla, toda la habitación queda a oscuras */
        .penumbra {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 7;
            background: #000;
            opacity: 0;
            animation: parpadeo-oscuro 5.3s infinite;
        }

        /* Parpadeo irregular: estable casi todo el tiempo, con ráfagas de fallos */
        @keyframes parpadeo-luz {
            0%, 17%, 22%, 54%, 58%, 100% { opacity: 1; }
            18%  { opacity: .05; }
            19%  { opacity: 1; }
            20%  { opacity: .2; }
            21%  { opacity: .9; }
            55%  { opacity: 0; }
            56%  { opacity: .7; }
            57%  { opacity: .1; }
            80%  { opacity: .75; }
            81%  { opacity: 1; }
        }

        @keyframes parpadeo-oscuro {
            0%, 17%, 22%, 54%, 58%, 100% { opacity: 0; }
            18%  { opacity: .92; }
            19%  { opacity: 0; }
            20%  { opacity: .8; }
            21%  { opacity: .08; }
            55%  { opacity: .96; }
            56%  { opacity: .25; }
            57%  { opacity: .88; }
            80%  { opacity: .3; }
            81%  { opacity: 0; }
        }

        /* ===== NIEVE DE MONITOR ANTIGUO (zona del mapeado: 140,320 → 254,407) ===== */
        .nieve {
            position: absolute;
            left: 140px;
            top: 320px;
            width: 114px;
            height: 87px;
            z-index: 3;
            pointer-events: none;
            image-rendering: pixelated;
            /* mismo polígono que tu <area>, con las coordenadas restadas a (140,320) */
            clip-path: polygon(1px 2px, 114px 0px, 114px 80px, 109px 83px,
                               9px 87px, 5px 86px, 3px 85px, 0px 4px);
            animation: nieve-brillo 0.13s steps(2) infinite;
        }

        /* Líneas de barrido y bordes oscuros del tubo */
        .nieve-capa {
            position: absolute;
            left: 140px;
            top: 320px;
            width: 114px;
            height: 87px;
            z-index: 3;
            pointer-events: none;
            clip-path: polygon(1px 2px, 114px 0px, 114px 80px, 109px 83px,
                               9px 87px, 5px 86px, 3px 85px, 0px 4px);
            background:
                repeating-linear-gradient(to bottom,
                    rgba(0,0,0,0) 0, rgba(0,0,0,0) 1px, rgba(0,0,0,.28) 2px),
                radial-gradient(ellipse at center,
                    rgba(0,0,0,0) 45%, rgba(0,0,0,.55) 100%);
        }

        @keyframes nieve-brillo {
            0%   { filter: brightness(1.05) contrast(1.1); }
            100% { filter: brightness(.8)  contrast(1.25); }
        }

        /* ===== PANTALLA DEL MONITOR (ajustada al cristal de la imagen) ===== */
        .pantalla-monitor {
            position: absolute;
            left: 388px;
            top: 143px;
            width: 650px;
            height: 350px;
            background: #14161a;
            padding: 8px 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 0 14px rgba(0, 0, 0, .8);
            z-index: 2;
        }

        /* Líneas de barrido tipo CRT sobre la pantalla */
        .pantalla-monitor::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(to bottom,
                        rgba(0, 0, 0, 0) 0, rgba(0, 0, 0, 0) 2px,
                        rgba(0, 0, 0, .18) 3px);
        }

        .pantalla-monitor h1 {
            text-align: center;
            font-size: 14px;
            font-weight: normal;
            margin-bottom: 6px;
            color: #b8c4b0;
            letter-spacing: 1px;
        }

        /* CUADRÍCULA 3 filas x 5 columnas */
        .galeria {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 6px;
            flex: 1;
            min-height: 0;
        }

        .celda {
            background: #000;
            border: 1px solid #2c3128;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .celda img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: grayscale(.6) contrast(1.05);
        }

        .celda .etiqueta {
            position: absolute;
            left: 4px;
            top: 3px;
            font-size: 9px;
            color: #d6e6cc;
            text-shadow: 0 0 3px #000;
            pointer-events: none;
        }

        .celda:hover { border-color: #8fb07c; }
        .celda:hover img { filter: none; }

        /* ===== VENTANA EMERGENTE: FOTO (izquierda) + TEXTO (derecha) ===== */
        .visor {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 1000;
        }
        .visor.abierto { display: flex; }

        .mitad-foto {
            position: relative;
            width: 50%;
            height: 100%;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mitad-foto img {
            width: 100%;
            height: 100%;
            object-fit: contain;   /* se estira hasta llenar la mitad sin deformarse */
            display: block;
        }

        .mitad-texto { width: 50%; height: 100%; background: #fff; }
        .mitad-texto iframe { width: 100%; height: 100%; border: none; display: block; }

        .cerrar {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: #e53935;
            color: #fff;
            font-size: 22px;
            line-height: 36px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .5);
            z-index: 2;
        }
        .cerrar:hover { background: #b71c1c; }
        .cerrar:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

        /* Si la persona prefiere menos movimiento, la lámpara queda fija */
        @media (prefers-reduced-motion: reduce) {
            .brillo,
            .penumbra { animation: none; }
        }
    </style>
</head>
<body>

    <div class="escena" id="escena">
        <img class="fondo" src="mapa.jpg" alt="Habitación con monitor de cámaras de seguridad">

        <!-- Nieve en el monitor antiguo de la izquierda -->
        <canvas class="nieve" id="nieve" width="57" height="44"></canvas>
        <div class="nieve-capa" aria-hidden="true"></div>

        <!-- Galería sobre el cristal del monitor -->
        <div class="pantalla-monitor">
            <h1>Cámaras de seguridad</h1>
            <div class="galeria" id="galeria"></div>
        </div>

        <!-- Oscuridad alrededor del cono, brillo del cono y apagón del parpadeo -->
        <div class="oscuridad" aria-hidden="true"></div>
        <div class="brillo" aria-hidden="true"></div>
        <div class="penumbra" aria-hidden="true"></div>
    </div>

    <!-- VENTANA EMERGENTE -->
    <div class="visor" id="visor">
        <div class="mitad-foto">
            <button class="cerrar" id="btnCerrar" aria-label="Cerrar">&times;</button>
            <img id="imagenGrande" src="" alt="">
        </div>
        <div class="mitad-texto">
            <iframe id="marcoTexto" src="about:blank" title="Texto de la foto"></iframe>
        </div>
    </div>

    <script>
        // ---- Escalar la escena para que quepa en cualquier pantalla ----
        const escena = document.getElementById('escena');
        function ajustar() {
            const s = Math.min(window.innerWidth / 1422, window.innerHeight / 736);
            escena.style.setProperty('--escala', s);
        }
        window.addEventListener('resize', ajustar);
        ajustar();


        // ---- Nieve de TV: ruido aleatorio en blanco y negro ----
        (function () {
            const c = document.getElementById('nieve');
            const ctx = c.getContext('2d');
            const w = c.width, h = c.height;
            const img = ctx.createImageData(w, h);
            const d = img.data;
            function fotograma() {
                for (let i = 0; i < d.length; i += 4) {
                    const v = Math.random() * 255 | 0;
                    d[i] = d[i + 1] = d[i + 2] = v;
                    d[i + 3] = 255;
                }
                ctx.putImageData(img, 0, 0);
            }
            fotograma();
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            setInterval(fotograma, 50);   // ~20 imágenes por segundo
        })();

        // ---- Crear las 15 celdas ----
        const galeria = document.getElementById('galeria');
        for (let n = 1; n <= 15; n++) {
            const celda = document.createElement('div');
            celda.className = 'celda';
            celda.tabIndex = 0;
            celda.innerHTML =
                '<img src="foto' + n + '.jpg" alt="Foto ' + n + '">' +
                '<span class="etiqueta">CAM ' + String(n).padStart(2, '0') + '</span>';
            celda.addEventListener('dblclick', () => abrir(n, celda.querySelector('img')));
            celda.addEventListener('keydown', e => { if (e.key === 'Enter') abrir(n, celda.querySelector('img')); });
            galeria.appendChild(celda);
        }

        // ---- Visor ----
        const visor = document.getElementById('visor');
        const imagenGrande = document.getElementById('imagenGrande');
        const marcoTexto = document.getElementById('marcoTexto');
        const btnCerrar = document.getElementById('btnCerrar');
        let bloqueado = false;

        function abrir(numero, img) {
            if (bloqueado) return;
            imagenGrande.src = img.src;
            imagenGrande.alt = img.alt;
            marcoTexto.src = 'texto' + numero + '.html';
            visor.classList.add('abierto');
        }

        function cerrar() {
            visor.classList.remove('abierto');
            marcoTexto.src = 'about:blank';
            bloqueado = true;
            setTimeout(() => { bloqueado = false; }, 600);
        }

        btnCerrar.addEventListener('click', cerrar);
        document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrar(); });
    </script>

</body>
</html>
